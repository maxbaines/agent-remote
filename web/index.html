<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>JustTerminal</title>
    <meta name="description" content="Persistent terminal workspaces in your browser." />

    <!-- PWA: theme + installability. The web app manifest itself is generated
         and injected by vite-plugin-pwa at build time. -->
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- iOS standalone / home-screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JustTerminal" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        background: #1e1e1e;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      mux-app {
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          0
          env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <mux-app></mux-app>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
