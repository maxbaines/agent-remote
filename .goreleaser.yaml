version: 2

before:
  hooks:
    - go mod tidy
    - npm --prefix web ci --prefer-offline
    - npm --prefix web run build

builds:
  - id: just-terminal-linux
    main: ./cmd/just-terminal
    binary: just-terminal
    env:
      # CGO_ENABLED=1 required for msteinert/pam/v2 (PAM Phase 1 auth backend)
      # which is a C binding and cannot build with CGO disabled.
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    # Linux arm64 excluded: github.com/msteinert/pam/v2 has build constraints
    # that exclude Linux ARM targets during cross-compilation. Phase 4/5 may add
    # platform backends without this constraint.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
  - id: just-terminal-darwin
    main: ./cmd/just-terminal
    binary: just-terminal
    env:
      # CGO_ENABLED=0: Darwin build doesn't use C bindings (OpenDirectory PAM
      # backend arrives in Phase 4). Pure Go build for maximum portability.
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^style:"
      - Merge pull request
      - Merge branch
